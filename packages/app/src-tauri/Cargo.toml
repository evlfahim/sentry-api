[package]
name = "sentry-api"
version = "0.1.0"
description = "A git-native API client"
authors = ["you"]
edition = "2021"

[lib]
name = "sentry_api_lib"
crate_type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
