[package]
name = "sentry-api"
version = "0.1.0"
description = "A git-native API client"
authors = ["sentry-api contributors"]
edition = "2021"

# The Cargo crate lives at packages/app (next to tauri.conf.json); the Rust
# sources are kept under src-tauri/src.
[[bin]]
name = "sentry-api"
path = "src-tauri/src/main.rs"

[lib]
name = "sentry_api_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src-tauri/src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.12"
